    <rect width="1425" height="178" rx="43" fill="#07565a"/>
    <circle cx="94" cy="89" r="70" fill="none" stroke="#8bdad3" stroke-width="3"/>
    <path d="M62 75 L96 53 L130 75 L96 97 Z" fill="#ffb448"/><path d="M75 86 L75 114 Q96 130 119 114 L119 86" fill="#ffb448"/>
