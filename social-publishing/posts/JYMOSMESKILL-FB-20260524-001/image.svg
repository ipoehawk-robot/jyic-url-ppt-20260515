    <g transform="translate(180 795)"><circle r="66" fill="none" stroke="#86d9d0" stroke-width="3"/><path d="M0 -43 L40 -20 L30 37 L0 57 L-30 37 L-40 -20 Z" fill="none" stroke="#86d9d0" stroke-width="6"/><path d="M-20 0 L-5 18 L28 -22" fill="none" stroke="#86d9d0" stroke-width="9" stroke-linecap="round"/><text y="150" font-size="38">重點整理</text><text y="198" font-size="31" class="light">系統化學習</text></g>
    <g transform="translate(525 795)"><circle r="66" fill="none" stroke="#86d9d0" stroke-width="3"/><circle r="43" fill="none" stroke="#86d9d0" stroke-width="7"/><line x1="-59" x2="59" stroke="#86d9d0" stroke-width="5"/><line y1="-59" y2="59" stroke="#86d9d0" stroke-width="5"/><text y="150" font-size="38">精準練題</text><text y="198" font-size="31" class="light">掌握命題方向</text></g>
    <g transform="translate(870 795)"><circle r="66" fill="none" stroke="#86d9d0" stroke-width="3"/><rect x="-42" y="8" width="22" height="42" fill="#86d9d0"/><rect x="-8" y="-12" width="22" height="62" fill="#86d9d0"/><rect x="26" y="-38" width="22" height="88" fill="#86d9d0"/><text y="150" font-size="38">AI 智能分析</text><text y="198" font-size="31" class="light">找出弱點強化</text></g>
    <g transform="translate(1235 795)"><circle r="66" fill="none" stroke="#86d9d0" stroke-width="3"/><rect x="-37" y="-50" width="74" height="100" rx="9" fill="none" stroke="#86d9d0" stroke-width="7"/><path d="M-18 -4 L-5 12 L23 -25" fill="none" stroke="#86d9d0" stroke-width="8" stroke-linecap="round"/><text y="150" font-size="38">模擬測驗</text><text y="198" font-size="31" class="light">考前實戰演練</text></g>
