<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="2160" viewBox="0 0 2160 2160">
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="75%">
      <stop offset="0" stop-color="#176f75"/>
      <stop offset="0.45" stop-color="#083f45"/>
      <stop offset="1" stop-color="#041f25"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff9f35"/></linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fbfffb"/><stop offset="1" stop-color="#dfeeea"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="28" stdDeviation="25" flood-color="#000" flood-opacity="0.42"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .sans{font-family:'STHeiti','Hiragino Sans GB','PingFang TC','Noto Sans CJK TC',sans-serif;font-weight:700;}
      .light{font-family:'STHeiti','Hiragino Sans GB','PingFang TC',sans-serif;font-weight:400;}
      .serif{font-family:'Songti SC','Songti TC','STSong',serif;font-weight:900;}
      .white{fill:#fffdf5}.mint{fill:#94ded2}.gold{fill:url(#gold)}.teal{fill:#0b6467}
    </style>
  </defs>
  <rect width="2160" height="2160" fill="url(#glow)"/>
