  <circle cx="230" cy="1860" r="330" fill="#f2a93c" opacity="0.08" filter="url(#soft)"/>

  <!-- network pattern -->
  <g opacity="0.34" stroke="#7bdcd5" stroke-width="3" fill="#9be7df">
    <path d="M90 1130 L240 1015 L410 1108 L570 990 L760 1088 L920 960 L1110 1045 L1280 925 L1450 1025 L1620 880 L1810 975 L2000 845" fill="none"/>
    <path d="M1320 560 L1460 460 L1588 545 L1740 430 L1890 540 L2010 402" fill="none"/>
    <g><circle cx="90" cy="1130" r="8"/><circle cx="240" cy="1015" r="8"/><circle cx="410" cy="1108" r="8"/><circle cx="570" cy="990" r="8"/><circle cx="760" cy="1088" r="8"/><circle cx="920" cy="960" r="8"/><circle cx="1110" cy="1045" r="8"/><circle cx="1280" cy="925" r="8"/><circle cx="1450" cy="1025" r="8"/><circle cx="1620" cy="880" r="8"/><circle cx="1810" cy="975" r="8"/><circle cx="2000" cy="845" r="8"/></g>
    <g><circle cx="1320" cy="560" r="7"/><circle cx="1460" cy="460" r="7"/><circle cx="1588" cy="545" r="7"/><circle cx="1740" cy="430" r="7"/><circle cx="1890" cy="540" r="7"/><circle cx="2010" cy="402" r="7"/></g>
  </g>

  <!-- logo -->
  <g transform="translate(105 105)">
    <circle r="58" fill="none" stroke="#fffdf5" stroke-width="7"/>
    <path d="M0 45 C-10 10 -38 -15 -45 -42 M0 45 C0 5 0 -24 0 -48 M0 45 C10 10 38 -15 45 -42 M0 20 C-20 0 -30 -22 -25 -45 M0 20 C20 0 30 -22 25 -45" fill="none" stroke="#fffdf5" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-45" cy="-42" r="7"/><circle cx="0" cy="-48" r="7"/><circle cx="45" cy="-42" r="7"/><circle cx="-25" cy="-45" r="6"/><circle cx="25" cy="-45" r="6"/>
  </g>
