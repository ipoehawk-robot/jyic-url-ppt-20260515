      <g transform="translate(75 270)"><rect width="42" height="42" fill="none" stroke="#159078" stroke-width="5"/><path d="M9 22 L20 34 L40 7" fill="none" stroke="#159078" stroke-width="6"/><text x="75" y="34">錯題回看</text></g>
      <g transform="translate(75 335)"><rect width="42" height="42" fill="none" stroke="#159078" stroke-width="5"/><path d="M9 22 L20 34 L40 7" fill="none" stroke="#159078" stroke-width="6"/><text x="75" y="34">解析整理</text></g>
      <g transform="translate(75 400)"><rect width="42" height="42" fill="none" stroke="#159078" stroke-width="5"/><path d="M9 22 L20 34 L40 7" fill="none" stroke="#159078" stroke-width="6"/><text x="75" y="34">模擬測驗</text></g>
    </g>
  </g>

  <!-- tablet / quiz UI -->
  <g filter="url(#shadow)">
    <ellipse cx="1475" cy="1840" rx="520" ry="90" fill="#000" opacity="0.32"/>
    <path d="M1070 1015 L1945 1150 L1810 1815 L885 1640 Z" fill="#142327" stroke="#45767a" stroke-width="9"/>
    <path d="M1145 1100 L1850 1208 L1742 1684 L1012 1552 Z" fill="url(#screen)" stroke="#9bc9c3" stroke-width="5"/>
    <path d="M1145 1100 L1850 1208 L1819 1340 L1113 1230 Z" fill="#07585d"/>
    <text x="1208" y="1165" font-size="41" class="sans white">練習題</text>
    <text x="1710" y="1243" font-size="30" class="sans white">1 / 40</text>
    <text x="1145" y="1305" font-size="37" class="sans" fill="#21383b">資訊類檢定複習時，最適合先確認哪一項？</text>
    <g font-size="31" class="sans" fill="#2d4a4d">
      <rect x="1095" y="1366" width="650" height="54" rx="27" fill="#f8fbfa"/><text x="1128" y="1405">A　只看答案，不回頭檢討</text>
      <rect x="1082" y="1444" width="670" height="56" rx="28" fill="#d5eee8"/><text x="1118" y="1483">B　用題庫找出常錯觀念</text><circle cx="1705" cy="1472" r="23" fill="#178c7d"/><path d="M1693 1471 L1704 1483 L1720 1455" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <rect x="1068" y="1522" width="650" height="54" rx="27" fill="#f8fbfa"/><text x="1102" y="1561">C　考前才一次背完</text>
      <rect x="1055" y="1600" width="650" height="54" rx="27" fill="#f8fbfa"/><text x="1088" y="1639">D　忽略解析直接下一題</text>
    </g>
    <rect x="1030" y="1685" width="675" height="130" rx="24" fill="#e1f0ed"/>
    <text x="1070" y="1730" font-size="34" class="sans" fill="#08736f">解析</text>
    <text x="1070" y="1780" font-size="29" class="light" fill="#355b5e">先從錯題與解析回推觀念，能更快安排下一輪複習。</text>
  </g>

  <!-- CTA bar -->
