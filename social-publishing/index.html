<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社群發佈管控｜小園入口網站</title><meta name="description" content="勁園社群發文上架日期與文案鏈結管控"><link rel="stylesheet" href="../portal.css"><style>
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 18px}.search{flex:1;min-width:260px;padding:14px 16px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.09);color:var(--ink);font-size:1rem;outline:none}.search::placeholder{color:rgba(220,236,255,.58)}.table-wrap{overflow:auto;border-radius:26px;border:1px solid var(--line);background:rgba(255,255,255,.075);box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:860px}th,td{padding:16px 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1);vertical-align:top}th{position:sticky;top:0;background:rgba(12,20,39,.96);color:#dff8ff;font-size:.9rem;letter-spacing:.04em}td{color:#edf7ff;line-height:1.55}.muted{color:var(--muted);font-size:.92rem}.empty{padding:22px;color:var(--muted)}.caption-link{color:#7ff3d0;font-weight:900}.status{display:inline-flex;padding:6px 10px;border-radius:999px;background:rgba(127,243,208,.12);border:1px solid rgba(127,243,208,.28);color:#b7ffe9;font-weight:850}.count{color:var(--muted)}.note-box{margin:18px 0;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--muted);line-height:1.7}.thumb{width:70px;height:70px;border-radius:16px;object-fit:cover;border:1px solid rgba(255,255,255,.16)}@media(max-width:760px){table{min-width:760px}.toolbar{display:block}.search{width:100%}}
</style></head><body><div class="wrap"><section class="hero"><div class="kicker">SOCIAL PUBLISHING CONTROL</div><h1>社群發佈管控</h1><p class="lead">第二層列表集中管理每次社群發文紀錄。可搜尋文案標題、粉絲頁名稱、發布時間與狀態；之後每次完成發文，都同步更新這裡。</p></section>
<div class="bottom-nav"><a class="home" href="../">回主入口</a><a href="../jyic/">勁園網站</a><a href="../html-ppt/">HTML PPT</a></div>
<section class="note-box">目前欄位依 Jason 指示包含：文案的標題、文案的鏈結、發佈的時間、發布的粉絲頁名稱。額外保留平台、狀態與風險分級，方便後續追蹤。</section>
<div class="toolbar"><input id="q" class="search" type="search" placeholder="搜尋標題、粉絲頁、時間、狀態…"><span id="count" class="count"></span></div>
<div class="table-wrap"><table><thead><tr><th>文案標題</th><th>文案鏈結</th><th>發佈時間</th><th>發布粉絲頁名稱</th><th>平台</th><th>狀態</th><th>風險</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>沒有符合搜尋條件的發佈紀錄。</div></div>
</div><script>
const DATA = [
  {id:'JYMOSME-FB-20260518-001',title:'通勤 10 分鐘，也能開始練初等考題',captionUrl:'posts/JYMOSME-FB-20260518-001/caption.txt',publishedAt:'2026-05-18 22:12',pageName:'勁園AI 國考網',platform:'Facebook',status:'已上架',riskLevel:'綠燈低風險'}
];
const rows=document.getElementById('rows'), q=document.getElementById('q'), count=document.getElementById('count'), empty=document.getElementById('empty');
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){const term=q.value.trim().toLowerCase();const list=DATA.filter(x=>[x.title,x.captionUrl,x.publishedAt,x.pageName,x.platform,x.status,x.riskLevel].join(' ').toLowerCase().includes(term));rows.innerHTML=list.map(x=>`<tr><td><strong>${esc(x.title)}</strong><div class="muted">${esc(x.id)}</div></td><td><a class="caption-link" href="${esc(x.captionUrl)}" target="_blank" rel="noopener">查看文案</a></td><td>${esc(x.publishedAt)}</td><td>${esc(x.pageName)}</td><td>${esc(x.platform)}</td><td><span class="status">${esc(x.status)}</span></td><td>${esc(x.riskLevel)}</td></tr>`).join('');count.textContent=`共 ${list.length} 筆`;empty.hidden=list.length!==0}
q.addEventListener('input',render);render();
</script></body></html>
